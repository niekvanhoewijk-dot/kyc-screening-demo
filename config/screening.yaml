# Mock ScreeningProvider (World-Check / OFAC style). Matching settings for the seeded fictional
# watchlist in fixtures/screening/watchlist.yaml. Hits are triaged by the analyst; nothing auto-clears.
version: 1
provider: "Demo watchlist (fictional)"
