# Analyst console settings (docs/spec/01: queue, case view, actions).
version: 1

# Demo analysts. No real authentication: the console asks who is working, for the audit trail.
analysts:
  - {id: analyst-1, name: "Analyst One"}
  - {id: analyst-2, name: "Analyst Two"}

# Queue age filter options, in days since submission.
age_filters_days: [1, 3, 7]

# Default operating mode (spec 01 orchestration lane). Switchable in the console; stored in the DB.
default_mode: mvp1     # mvp1 = manual checks, Claude off; mvp2 = Claude pre-review on

# Lifecycle and policy simulator (docs/spec/08 section 5.6): clock buttons. The AMLR switch-on date comes from
# the policy (periodic_review.regulatory_effective_from), not from here.
simulator:
  clock_steps:
    - {label: "+14 days", days: 14}
    - {label: "+1 month", months: 1}
    - {label: "+1 year", months: 12}
  # Scenario presets (spec 08 section 6): the setups of tests/golden/scenarios.json, one click each.
  # clock: demo_date = the synthetic book's demo date (fixtures/portfolio/book.json), amlr = the policy's
  # periodic_review.regulatory_effective_from. A preset moves only the simulated clock; it changes no data.
  presets:
    - id: S1
      label: "S1 FATF October 2026 plenary"
      clock: demo_date
      baseline: P1
      candidate: P2
      note: "June list against October list. BG, CI, CD and MC leave Auto-High and lose the EDD requirement; nobody else changes. Then flip the delisted knob to hold: no one changes. Delisting is a policy question, not an automatic discount."
    - id: S2
      label: "S2 Myanmar knob"
      clock: demo_date
      baseline: P2
      candidate: P2
      cfa: follow_fatf
      note: "Follow FATF for Myanmar: the two Myanmar customers move from Prohibited to Auto-High (EDD, $40,000 category cap); DPRK and Iran stay Prohibited. Apply it, then compare back to P2: they go to analyst review, never automatic closure."
    - id: S3
      label: "S3 AMLR switch-on"
      clock: amlr
      show: review_due
      note: "On 10 Jul 2027 EDD customers last reviewed more than 12 months ago, and others more than 60 months ago, have a review due, in force. Set the date one day earlier: the same reviews show as preview."
    - id: S4
      label: "S4 Proof of residence"
      clock: demo_date
      subject: BK-15
      show: por_notice
      note: "BK-15's proof of residence expires in 14 days: notice now. Press +14 days: expired, deposits and withdrawals blocked. Inject a new proof of residence to clear it."
    - id: S5
      label: "S5 Threshold reached"
      clock: demo_date
      subject: BK-16
      event: deposit
      amount: 700
      note: "BK-16 is $599 under its threshold. Inject the $700 deposit: threshold reached, routed to EDD. Then inject an EDD outcome of $45,000: the engine sets a new threshold of $36,000."
