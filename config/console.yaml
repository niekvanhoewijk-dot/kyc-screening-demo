# Analyst console settings (docs/spec/01: queue, case view, actions).
version: 1

# Demo analysts. No real authentication: the console asks who is working, for the audit trail.
analysts:
  - {id: analyst-1, name: "Analyst One"}
  - {id: analyst-2, name: "Analyst Two"}

# Queue age filter options, in days since submission.
age_filters_days: [1, 3, 7]

# Default operating mode (spec 01 orchestration lane). Switchable in the console; stored in the DB.
default_mode: mvp1     # mvp1 = manual checks, Claude off; mvp2 = Claude pre-review on

# Lifecycle and policy simulator (docs/spec/08 section 5.6): clock buttons. The AMLR switch-on date comes from
# the policy (periodic_review.regulatory_effective_from), not from here.
simulator:
  clock_steps:
    - {label: "+14 days", days: 14}
    - {label: "+1 month", months: 1}
    - {label: "+1 year", months: 12}
