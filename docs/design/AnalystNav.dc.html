<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Analyst navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{opacity:.9}
a:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px}
@media (max-width: 900px){ .an{width:100% !important; min-height:auto !important;} }
</style>
</helmet>
<nav class="an" aria-label="Analyst" style="box-sizing:border-box; width:260px; max-width:100%; min-height:{{minh}}px; padding:36px 28px; background:#0A0A0A; color:#FFFFFF; font-family:'Alexandria',system-ui,sans-serif; display:flex; flex-direction:column; gap:36px;">
  <div style="display:flex; flex-direction:column; gap:6px;">
    <span style="font-size:12px; font-weight:500; letter-spacing:.16em; text-transform:uppercase; color:#A3A3A3;">Demo Digital Assets Platform</span>
    <span style="font-size:18px; font-weight:600;">Compliance</span>
  </div>
  <ul style="list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px;">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <li><a href="{{it.href}}" style="{{it.style}}">{{it.label}}</a></li>
    </sc-for>
  </ul>
  <div style="margin-top:auto; display:flex; flex-direction:column; gap:14px;">
    <div style="display:flex; flex-direction:column; gap:4px; padding-top:20px; border-top:1px solid #262626;">
      <span style="font-size:11px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:#A3A3A3;">Signed in as</span>
      <span style="font-size:15px; font-weight:500;">Analyst One</span>
    </div>
    <p style="margin:0; font-size:11px; line-height:1.55; color:#A3A3A3;">Illustrative demo on synthetic data. Not a regulated compliance system.</p>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":null,"default":"cases"},"minh":{"editor":null,"default":1300},"$preview":{"width":260,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'cases';
    const minh = Number(this.props.minh ?? 1300);
    const base = 'display:block; padding:12px 14px; border-radius:2px; font-size:15px; ';
    const mk = (id, label, href) => ({ label, href, style: base + (id === active ? 'background:#FFFFFF; color:#0A0A0A; font-weight:600;' : 'color:#D4D4D4; font-weight:400;') });
    return {
      minh,
      items: [
        mk('cases', 'Cases', 'C01-Analyst-Queue.dc.html'),
        mk('audit', 'Audit trail', '#'),
        mk('eval', 'Evaluation report', '#'),
        mk('demo', 'Demo controls', '#'),
      ],
    };
  }
}
</script>
</body>
</html>
