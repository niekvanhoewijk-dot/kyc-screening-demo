<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify email</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{opacity:.88}
input:focus-visible,a:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #0A0A0A;outline-offset:2px}
</style>
</helmet>
<div style="display:flex; flex-wrap:wrap; min-height:900px; background:#FFFFFF; color:#0A0A0A; font-family:'Alexandria',system-ui,sans-serif;">
  <dc-import name="LeftPanel" current="2" minh="900" title="Check your email" body="We sent a six-digit code. Enter it to confirm that this address is yours." hint-size="440px,900px"></dc-import>
  <main style="flex:999 1 560px; min-width:0; box-sizing:border-box; padding:72px 64px; display:flex; flex-direction:column;">
    <div style="max-width:560px; display:flex; flex-direction:column; gap:32px;">
      <div style="display:flex; flex-direction:column; gap:12px;">
        <span style="font-size:12px; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:#595959;">Step 2 of 8</span>
        <h1 style="margin:0; font-size:36px; line-height:1.15; font-weight:700; letter-spacing:-.01em;">Enter your code</h1>
        <p style="margin:0; font-size:16px; line-height:1.6; color:#595959;">We sent a six-digit code to <strong style="color:#0A0A0A; font-weight:600;">ada.sample@demo.test</strong>.</p>
      </div>

      <fieldset style="border:0; margin:0; padding:0;">
        <legend style="padding:0; margin-bottom:14px; font-size:13px; font-weight:500;">Six-digit code</legend>
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" value="4" style="box-sizing:border-box; width:56px; height:68px; text-align:center; border:2px solid #0A0A0A; border-radius:2px; font:600 26px 'Alexandria',system-ui,sans-serif; color:#0A0A0A; background:#FFFFFF;">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" value="8" style="box-sizing:border-box; width:56px; height:68px; text-align:center; border:2px solid #0A0A0A; border-radius:2px; font:600 26px 'Alexandria',system-ui,sans-serif; color:#0A0A0A; background:#FFFFFF;">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3" value="2" style="box-sizing:border-box; width:56px; height:68px; text-align:center; border:2px solid #0A0A0A; border-radius:2px; font:600 26px 'Alexandria',system-ui,sans-serif; color:#0A0A0A; background:#FFFFFF;">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4" value="" style="box-sizing:border-box; width:56px; height:68px; text-align:center; border:1px solid #6B6B6B; border-radius:2px; font:600 26px 'Alexandria',system-ui,sans-serif; color:#0A0A0A; background:#FFFFFF;">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5" value="" style="box-sizing:border-box; width:56px; height:68px; text-align:center; border:1px solid #6B6B6B; border-radius:2px; font:600 26px 'Alexandria',system-ui,sans-serif; color:#0A0A0A; background:#FFFFFF;">
          <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6" value="" style="box-sizing:border-box; width:56px; height:68px; text-align:center; border:1px solid #6B6B6B; border-radius:2px; font:600 26px 'Alexandria',system-ui,sans-serif; color:#0A0A0A; background:#FFFFFF;">
        </div>
      </fieldset>

      <p style="margin:0; padding:16px 18px; background:#F5F5F5; border-radius:2px; font-size:13px; line-height:1.6; color:#262626;"><strong style="font-weight:600;">Demo only.</strong> No email is sent. The code appears in the Terminal window that is running the app.</p>

      <div style="display:flex; align-items:center; gap:28px; flex-wrap:wrap;">
        <a href="A03-Overview.dc.html" style="display:inline-flex; align-items:center; gap:12px; height:52px; padding:0 32px; background:#0A0A0A; color:#FFFFFF; border-radius:2px; font-size:15px; font-weight:600; letter-spacing:.02em;">
          Verify
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
        <a href="#" style="font-size:14px; font-weight:500; text-decoration:underline; text-underline-offset:4px;">Send a new code</a>
        <a href="Main.dc.html" style="font-size:14px; font-weight:500; text-decoration:underline; text-underline-offset:4px;">Use a different email</a>
      </div>
    </div>
  </main>
</div>
